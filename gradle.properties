# Plugin metadata.
# pluginVersion is the LOCAL / non-release fallback only. Releases are tag-driven: the Release
# workflow derives the version from the pushed git tag (v0.3.0 -> 0.3.0) via the PLUGIN_VERSION
# env var, which overrides this value. Keep this at the last released version for local builds.
pluginVersion=0.5.0

# IntelliJ Platform — compiled against 2024.1 (build 241), compatible with 241 and up.
# No upper bound is set (see build.gradle.kts ideaVersion.untilBuild) so the plugin stays
# installable on newer IDE releases instead of being blocked by a hardcoded cap.
platformVersion=2024.1
pluginSinceBuild=241

# GitHub Copilot plugin version (adjust to latest available on Marketplace)
copilotPluginVersion=1.5.32.8845

# Gradle
gradleVersion=9.0
org.gradle.caching=true
org.gradle.configuration-cache=false
kotlin.stdlib.default.dependency=false
