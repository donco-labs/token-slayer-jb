name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:

  # ─── Code Quality ────────────────────────────────────────────────────────────
  code-check:
    name: 🔍 Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Kotlin compile check
        run: ./gradlew compileKotlin compileTestKotlin --no-daemon

      - name: ktlint check
        run: ./gradlew ktlintCheck --no-daemon
        continue-on-error: true

  # ─── Build Matrix ────────────────────────────────────────────────────────────
  build:
    name: 🔨 Build (JDK ${{ matrix.jdk }})
    runs-on: ubuntu-latest
    needs: code-check
    strategy:
      matrix:
        jdk: [17, 21]
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK ${{ matrix.jdk }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.jdk }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build plugin
        run: ./gradlew buildPlugin --no-daemon

      - name: Verify plugin structure
        run: |
          PLUGIN_ZIP=$(ls build/distributions/*.zip 2>/dev/null | head -1)
          if [ -z "$PLUGIN_ZIP" ]; then
            echo "❌ Plugin ZIP not found in build/distributions/"
            exit 1
          fi
          echo "✅ Plugin built: $PLUGIN_ZIP ($(du -h "$PLUGIN_ZIP" | cut -f1))"

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-jdk${{ matrix.jdk }}
          path: build/reports/tests/
          retention-days: 7

  # ─── Security ────────────────────────────────────────────────────────────────
  security:
    name: 🛡️ Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for hardcoded secrets in source
        run: |
          echo "🔍 Scanning for hardcoded secrets in src/..."
          FOUND=0
          EXCLUDE="--exclude=SecretsDetector.kt --exclude=SecretsDetectorTest.kt"
          grep -rn $EXCLUDE -e "AKIA[0-9A-Z]\{16\}" src/ && FOUND=1 || true
          grep -rn $EXCLUDE -e "BEGIN.*PRIVATE KEY" src/ && FOUND=1 || true
          grep -rn $EXCLUDE -e "sk_live_" src/ && FOUND=1 || true
          grep -rn $EXCLUDE -e "ghp_[A-Za-z0-9]\{36\}" src/ && FOUND=1 || true
          grep -rn $EXCLUDE -e "AIza[0-9A-Za-z_-]\{35\}" src/ && FOUND=1 || true
          if [ "$FOUND" -eq 1 ]; then
            echo "❌ Potential secrets found in source code!"
            exit 1
          fi
          echo "✅ No secrets detected in source"

  # ─── Plugin Verification ─────────────────────────────────────────────────────
  verify:
    name: 🔬 Plugin Verifier
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run IntelliJ Plugin Verifier
        run: ./gradlew verifyPlugin --no-daemon

      - name: Upload verifier report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plugin-verifier-report
          path: build/reports/pluginVerifier/
          retention-days: 7

  # ─── Package ─────────────────────────────────────────────────────────────────
  package:
    name: 📦 Package Plugin
    runs-on: ubuntu-latest
    needs: [build, security, verify]
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build plugin ZIP
        run: ./gradlew buildPlugin --no-daemon

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: tokenslayer-plugin-zip
          path: build/distributions/*.zip
          retention-days: 30

      - name: Report plugin size
        run: |
          PLUGIN_ZIP=$(ls build/distributions/*.zip | head -1)
          SIZE=$(du -h "$PLUGIN_ZIP" | cut -f1)
          echo "📦 Package: $(basename $PLUGIN_ZIP) ($SIZE)"
          echo "### 📦 Plugin Package" >> $GITHUB_STEP_SUMMARY
          echo "- **File:** $(basename $PLUGIN_ZIP)" >> $GITHUB_STEP_SUMMARY
          echo "- **Size:** $SIZE" >> $GITHUB_STEP_SUMMARY
