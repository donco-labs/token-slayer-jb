name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # ─── Consolidated Build, Test & Verify Pipeline ──────────────────────────────
  ci:
    name: ⚡ CI Pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space
        run: |
          echo "=== Initial Disk Space ==="
          df -h
          
          echo "Pruning heavy pre-installed software to avoid space exhaustion..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          
          echo "=== Disk Space After Cleanup ==="
          df -h

      - uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      # ─── Code Quality ──────────────────────────────────────────────────────────
      - name: Kotlin compile & lint check
        run: |
          ./gradlew compileKotlin compileTestKotlin --no-daemon
          ./gradlew ktlintCheck --no-daemon
        continue-on-error: true

      # ─── Security Audit ────────────────────────────────────────────────────────
      - name: Check for hardcoded secrets in source
        run: |
          echo "🔍 Scanning for hardcoded secrets in src/..."
          FOUND=0
          EXCLUDE="--exclude=SecretsDetector.kt --exclude=SecretsDetectorTest.kt"
          grep -rn $EXCLUDE -e "AKIA[0-9A-Z]\{16\}" src/ && FOUND=1 || true
          grep -rn $EXCLUDE -e "BEGIN.*PRIVATE KEY" src/ && FOUND=1 || true
          grep -rn $EXCLUDE -e "sk_live_" src/ && FOUND=1 || true
          grep -rn $EXCLUDE -e "ghp_[A-Za-z0-9]\{36\}" src/ && FOUND=1 || true
          grep -rn $EXCLUDE -e "AIza[0-9A-Za-z_-]\{35\}" src/ && FOUND=1 || true
          if [ "$FOUND" -eq 1 ]; then
            echo "❌ Potential secrets found in source code!"
            exit 1
          fi
          echo "✅ No secrets detected in source"

      # ─── Run Tests ─────────────────────────────────────────────────────────────
      - name: Run unit tests
        run: ./gradlew test --no-daemon

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: build/reports/tests/
          retention-days: 7

      # ─── Plugin Verification ───────────────────────────────────────────────────
      - name: Run IntelliJ Plugin Verifier
        run: ./gradlew verifyPlugin --no-daemon

      - name: Upload verifier report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plugin-verifier-report
          path: build/reports/pluginVerifier/
          retention-days: 7

      # ─── Package Plugin ────────────────────────────────────────────────────────
      - name: Build plugin ZIP
        run: ./gradlew buildPlugin --no-daemon

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: tokenslayer-plugin-zip
          path: build/distributions/*.zip
          retention-days: 14

      - name: Report plugin size
        run: |
          PLUGIN_ZIP=$(ls build/distributions/*.zip 2>/dev/null | head -1)
          if [ -z "$PLUGIN_ZIP" ]; then
            echo "❌ Plugin ZIP not found in build/distributions/"
            exit 1
          fi
          SIZE=$(du -h "$PLUGIN_ZIP" | cut -f1)
          echo "📦 Package: $(basename $PLUGIN_ZIP) ($SIZE)"
          echo "### 📦 Plugin Package" >> $GITHUB_STEP_SUMMARY
          echo "- **File:** $(basename $PLUGIN_ZIP)" >> $GITHUB_STEP_SUMMARY
          echo "- **Size:** $SIZE" >> $GITHUB_STEP_SUMMARY
